[project]
name = "earth-watch"
version = "0.1.0"
description = "Personal climate dashboard data pipeline (M1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "pandas>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
earth-watch-pipeline = "earth_watch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["earth_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
