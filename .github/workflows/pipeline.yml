name: Data pipeline

on:
  workflow_dispatch:
  schedule:
    # Weekly refresh (Monday 06:00 UTC)
    - cron: "0 6 * * 1"

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run pipeline
        run: earth-watch-pipeline --output-dir output
      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: earth-watch-data
          path: output/
          retention-days: 90
      - name: Upload to R2 (optional)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: earth-watch
          OUTPUT_DIR: output
        run: python scripts/upload_r2.py
